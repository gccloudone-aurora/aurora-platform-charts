# Non-production smoke test. Replace the hostname and namespace before use.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-api-demo
  labels:
    namespace.ssc-spc.gc.ca/purpose: solution
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api-echo
  namespace: gateway-api-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api-echo
  template:
    metadata:
      labels:
        app: gateway-api-echo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api-echo
  namespace: gateway-api-demo
spec:
  selector:
    app: gateway-api-echo
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-api-echo
  namespace: gateway-api-demo
spec:
  parentRefs:
    - name: general
      namespace: ingress-general-system
      sectionName: https
  hostnames:
    - gateway-api-check.example.ca
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gateway-api-echo
          port: 80
