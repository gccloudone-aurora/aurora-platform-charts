{{- if has .Values.namespace.type (list "system" "gateway") }}
{{- if .Values.netpol.allowKeda }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keda-metrics-apiserver
  namespace: {{ .Release.Name }}
  annotations:
    kubernetes.io/description: |
      Network Policy to allow the Kubernetes API server to reach KEDA's metrics API server.
      This is required for the v1beta1.external.metrics.k8s.io APIService to function.
  labels:
    {{- include "aurora-namespace.labels" . | nindent 4 }}
spec:
  podSelector: {{ toYaml .Values.netpol.keda.metricsApi.podSelector | nindent 4 }}
  ingress:
    - ports:
        - protocol: TCP
          port: 443
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keda-metrics-apiserver-egress
  namespace: {{ .Release.Name }}
  annotations:
    kubernetes.io/description: |
      Network Policy to allow egress from KEDA metrics API server.
  labels:
    {{- include "aurora-namespace.labels" . | nindent 4 }}
spec:
  podSelector: {{ toYaml .Values.netpol.keda.metricsApi.podSelector | nindent 4 }}
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.netpol.keda.metricsApi.egressCidr }}
      ports:
        - protocol: TCP
          port: 443
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keda-operator
  namespace: {{ .Release.Name }}
  annotations:
    kubernetes.io/description: |
      Network Policy to allow communication for KEDA operator.
  labels:
    {{- include "aurora-namespace.labels" . | nindent 4 }}
spec:
  podSelector: {{ toYaml .Values.netpol.keda.operator.podSelector | nindent 4 }}
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keda-operator-egress
  namespace: {{ .Release.Name }}
  annotations:
    kubernetes.io/description: |
      Network Policy to allow egress from KEDA operator.
  labels:
    {{- include "aurora-namespace.labels" . | nindent 4 }}
spec:
  podSelector: {{ toYaml .Values.netpol.keda.operator.podSelector | nindent 4 }}
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.netpol.keda.operator.egressCidr }}
      ports:
        - protocol: TCP
          port: 443
  policyTypes:
    - Egress
{{- end }}
{{- end }}
