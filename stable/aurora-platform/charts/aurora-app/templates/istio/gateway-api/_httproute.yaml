{{- define "gatewayAPI.httproute" -}}
{{- $gateway := .Values.components.istio.gatewayAPI -}}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: {{ $gateway.name }}-redirect
    namespace: ingress-general-system
  spec:
    parentRefs:
      - name: {{ $gateway.name }}
        sectionName: http
    hostnames:
      - "*.{{ .Values.global.ingressDomain }}"
    rules:
      - filters:
          - type: RequestRedirect
            requestRedirect:
              scheme: https
              statusCode: 301
{{- end }}
