{{- if and .Values.components.istio.enabled .Values.components.istio.gatewayAPI.enabled }}
{{- $gateway := .Values.components.istio.gatewayAPI }}
{{- $proxyImage := $gateway.proxyImage }}
{{- if and (not $proxyImage) .Values.global.container.registry }}
{{- $proxyTag := default .Values.components.istio.istiod.helm.targetRevision (default .Values.components.istio.istiod.image.tag .Values.components.istio.istiod.proxy.image.tag) }}
{{- $proxyVariant := default .Values.components.istio.istiod.image.variant .Values.components.istio.istiod.proxy.image.variant }}
{{- if $proxyVariant }}
{{- $proxyTag = printf "%s-%s" $proxyTag $proxyVariant }}
{{- end }}
{{- $proxyImage = printf "%s/istio/proxyv2:%s" (trimSuffix "/" .Values.global.container.registry) $proxyTag }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.global.cluster }}-gateway-api-general"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.global.project }}
  source:
    chart: {{ .Values.global.raw.helm.chart }}
    repoURL: {{ default .Values.global.helm.repository .Values.global.raw.helm.repository }}
    targetRevision: {{ .Values.global.raw.helm.targetRevision }}
    helm:
      releaseName: gateway-api-general
      values: |
        resources:
          # Istio overlays these settings on the Deployment and Service it generates.
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: {{ $gateway.name }}-options
              namespace: ingress-general-system
            data:
              service: |
                metadata:
                  annotations:
                    {{- if eq .Values.global.provider "azure" }}
                    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
                    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: {{ required "global.load_balancer_subnet_name is required" .Values.global.load_balancer_subnet_name | quote }}
                    {{- else if eq .Values.global.provider "aws" }}
                    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
                    {{- end }}
                spec:
                  type: LoadBalancer
                  externalTrafficPolicy: Cluster
              deployment: |
                spec:
                  template:
                    spec:
                      {{- if .Values.components.istio.imagePullSecrets }}
                      imagePullSecrets: {{ toYaml .Values.components.istio.imagePullSecrets | nindent 24 }}
                      {{- end }}
                      affinity:
                        {{- if $gateway.affinity }}
                        {{- toYaml $gateway.affinity | nindent 24 }}
                        {{- else }}
                        podAntiAffinity:
                          preferredDuringSchedulingIgnoredDuringExecution:
                            - weight: 100
                              podAffinityTerm:
                                labelSelector:
                                  matchLabels:
                                    gateway.networking.k8s.io/gateway-name: {{ $gateway.name }}
                                topologyKey: kubernetes.io/hostname
                        {{- end }}
                      nodeSelector: {{ toYaml $gateway.nodeSelector | nindent 24 }}
                      tolerations: {{ toYaml $gateway.tolerations | nindent 24 }}
                      containers:
                        - name: istio-proxy
                          resources: {{ toYaml $gateway.resources | nindent 28 }}
              horizontalPodAutoscaler: |
                spec:
                  minReplicas: {{ $gateway.replicas.min }}
                  maxReplicas: {{ $gateway.replicas.max }}
                  metrics:
                    - type: Resource
                      resource:
                        name: cpu
                        target:
                          type: Utilization
                          averageUtilization: 80
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: {{ $gateway.name }}-tls
              namespace: ingress-general-system
              labels:
                use-general-solver: "true"
            spec:
              secretName: {{ $gateway.certificateSecretName }}
              dnsNames:
                - "*.{{ .Values.global.ingressDomain }}"
              issuerRef:
                kind: ClusterIssuer
                name: {{ $gateway.issuerName }}
              privateKey:
                rotationPolicy: Always
          - apiVersion: gateway.networking.k8s.io/v1
            kind: Gateway
            metadata:
              name: {{ $gateway.name }}
              namespace: ingress-general-system
              {{- if $proxyImage }}
              # The controller reads this annotation before applying Deployment overlays.
              annotations:
                sidecar.istio.io/proxyImage: {{ $proxyImage | quote }}
              {{- end }}
            spec:
              gatewayClassName: istio
              infrastructure:
                parametersRef:
                  group: ""
                  kind: ConfigMap
                  name: {{ $gateway.name }}-options
              listeners:
                - name: http
                  hostname: "*.{{ .Values.global.ingressDomain }}"
                  port: 80
                  protocol: HTTP
                  allowedRoutes:
                    namespaces:
                      from: Same
                - name: https
                  hostname: "*.{{ .Values.global.ingressDomain }}"
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - group: ""
                        kind: Secret
                        name: {{ $gateway.certificateSecretName }}
                  allowedRoutes:
                    namespaces:
                      from: Selector
                      selector:
                        matchLabels:
                          namespace.ssc-spc.gc.ca/purpose: solution
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: {{ $gateway.name }}-redirect
              namespace: ingress-general-system
            spec:
              parentRefs:
                - name: {{ $gateway.name }}
                  sectionName: http
              hostnames:
                - "*.{{ .Values.global.ingressDomain }}"
              rules:
                - filters:
                    - type: RequestRedirect
                      requestRedirect:
                        scheme: https
                        statusCode: 301
  destination:
    name: {{ .Values.global.cluster }}
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
