groups:
  - name: tetragon.rules
    rules:
      - alert: TetragonPrivilegeEscalationDetected
        annotations:
          message: 'Tetragon detected privilege escalation by {{ $$labels.binary }} in {{ $$labels.namespace }}/{{ $$labels.workload }} (pod {{ $$labels.pod }}, node {{ $$labels.node }}, hook {{ $$labels.hook }}).'
          value: '{{ $$value }}'
        expr: 'increase(tetragon_policy_events_total{policy="privileges-raise"}[5m]) > 0'
        keep_firing_for: 15m
        labels:
          scope: cluster
          severity: P2-Major
          teams_version: v2

      - alert: TetragonFileMonitoringDetected
        annotations:
          message: 'Tetragon detected sensitive file activity by {{ $$labels.binary }} in {{ $$labels.namespace }}/{{ $$labels.workload }} (pod {{ $$labels.pod }}, node {{ $$labels.node }}, hook {{ $$labels.hook }}).'
          value: '{{ $$value }}'
        expr: 'increase(tetragon_policy_events_total{policy="file-monitoring-filtered"}[5m]) > 0'
        keep_firing_for: 15m
        labels:
          scope: cluster
          severity: P2-Major
          teams_version: v2

      - alert: TetragonMetricsUnavailable
        annotations:
          message: 'Tetragon metrics target has been unavailable for more than 5 minutes.'
          value: '{{ $$value }}'
        expr: 'up{job="tetragon"} == 0 or absent(up{job="tetragon"})'
        for: 5m
        labels:
          scope: cluster
          severity: P2-Major
          teams_version: v2

      - alert: TetragonEventsDropped
        annotations:
          message: 'Tetragon reported dropped events or internal errors during the last 5 minutes.'
          value: '{{ $$value }}'
        expr: |
          sum(increase(tetragon_errors_total[5m])) > 0
            or sum(increase(tetragon_bpf_missed_events_total[5m])) > 0
            or sum(increase(tetragon_observer_ringbuf_events_lost_total[5m])) > 0
            or sum(increase(tetragon_observer_ringbuf_queue_events_lost_total[5m])) > 0
        labels:
          scope: cluster
          severity: P2-Major
          teams_version: v2
