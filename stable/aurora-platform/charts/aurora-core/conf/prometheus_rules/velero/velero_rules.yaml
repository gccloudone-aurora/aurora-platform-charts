groups:
  - name: velero.rules
    rules:
      - expr: 'sum by(schedule) (velero_backup_failure_total{schedule!=""} - velero_backup_failure_total offset 10m)'
        record: velero_schedule_failure_increment
      - expr: 'sum by(schedule) (velero_backup_partial_failure_total{schedule!=""} - velero_backup_partial_failure_total offset 10m)'
        record: velero_schedule_partial_failure_increment
      - expr: 'time() - max by(schedule) (velero_backup_last_sucessful_timestamp{schedule!=""})'
        record: velero_schedule_last_success_age_seconds

      - alert: VeleroBackupFailure
        annotations:
          message: 'Failed backup in Velero schedule {{ $$labels.schedule }}.'
          runbook: "https://aurora.gccloudone.ca/en/documentation/monitoring-surveillance/prometheus/cluster-alert-runbooks/velero/"
        expr: 'velero_schedule_failure_increment > 0'
        for: 15s
        labels:
          resolves: never
          scope: cluster
          severity: P3-Minor

      - alert: VeleroBackupPartialFailure
        annotations:
          message: 'Partially failed backup in Velero schedule {{ $$labels.schedule }}.'
          runbook: "https://aurora.gccloudone.ca/en/documentation/monitoring-surveillance/prometheus/cluster-alert-runbooks/velero/"
        expr: 'velero_schedule_partial_failure_increment > 0'
        for: 15s
        labels:
          resolves: never
          scope: cluster
          severity: P3-Minor

      - alert: ContinuousVeleroBackupFailure
        annotations:
          message: 'Continuous failed backup in Velero schedule {{ $$labels.schedule }}!'
          runbook: "https://aurora.gccloudone.ca/en/documentation/monitoring-surveillance/prometheus/cluster-alert-runbooks/velero/"
        expr: 'velero_schedule_failure_increment > 1'
        for: 10m
        labels:
          scope: cluster
          severity: P1-Critical

      - alert: ContinuousVeleroBackupPartialFailure
        annotations:
          message: 'Continuous partially failed backup in Velero schedule {{ $$labels.schedule }}!'
          runbook: "https://aurora.gccloudone.ca/en/documentation/monitoring-surveillance/prometheus/cluster-alert-runbooks/velero/"
        expr: 'velero_schedule_partial_failure_increment > 1'
        for: 10m
        labels:
          scope: cluster
          severity: P1-Critical

      - alert: VeleroBackupTakingLongTime
        annotations:
          message: 'A Velero backup for schedule {{ $$labels.schedule }} is taking longer then 2 hours and 30 minutes.'
          runbook: "https://aurora.gccloudone.ca/en/documentation/monitoring-surveillance/prometheus/cluster-alert-runbooks/velero/"
        expr: 'sum by(schedule) (changes(velero_backup_attempt_total{schedule!=""}[48h])) > 0 unless sum by(schedule) ((changes(velero_backup_success_total{schedule!=""}[2h30m]) + changes(velero_backup_partial_failure_total{schedule!=""}[2h30m]) + changes(velero_backup_failure_total{schedule!=""}[2h30m]) + changes(velero_backup_validation_failure_total{schedule!=""}[2h30m])) > 0)'
        for: 1m
        labels:
          resolves: never
          scope: cluster
          severity: P2-Major

      - alert: VeleroHourlyBackupFailure
        annotations:
          message: 'Hourly failure in backup schedule {{ $$labels.schedule }}!'
          runbook: "https://aurora.gccloudone.ca/en/documentation/monitoring-surveillance/prometheus/cluster-alert-runbooks/velero/"
        expr: 'sum by(schedule) (velero_backup_failure_total{schedule="velero-hourly-resources"} - velero_backup_failure_total{schedule="velero-hourly-resources"} offset 160m > 1)'
        for: 15s
        labels:
          scope: cluster
          severity: P2-Major

      - alert: VeleroHourlyBackupPartialFailure
        annotations:
          message: 'Hourly partial failure in backup schedule {{ $$labels.schedule }}.'
          runbook: "https://aurora.gccloudone.ca/en/documentation/monitoring-surveillance/prometheus/cluster-alert-runbooks/velero/"
        expr: 'sum by(schedule) (velero_backup_partial_failure_total{schedule="velero-hourly-resources"} - velero_backup_partial_failure_total{schedule="velero-hourly-resources"} offset 160m > 1)'
        for: 15s
        labels:
          scope: cluster
          severity: P2-Major

      # 24Hour threshold (86400 seconds is 24 hours). The One Hour for effectively makes it a 25 window
      # this is to reduce false positives on a missing backup
      - alert: VeleroNoRecentSuccessfulBackup
        annotations:
          message: 'Velero schedule {{ $$labels.schedule }} has not completed a successful backup in over 24 hours.'
          runbook: "https://aurora.gccloudone.ca/en/documentation/monitoring-surveillance/prometheus/cluster-alert-runbooks/velero/"
        expr: 'velero_schedule_last_success_age_seconds{schedule!=""} > 86400'
        for: 1h
        labels:
          scope: cluster
          severity: P2-Major