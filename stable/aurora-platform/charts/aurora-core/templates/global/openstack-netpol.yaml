{{- if eq .Values.global.provider "openstack" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.global.cluster }}-global-netpol"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.global.project }}
  source:
    chart: {{ .Values.global.raw.helm.chart }}
    repoURL: {{ default .Values.global.helm.repository .Values.global.raw.helm.repository }}
    targetRevision: {{ .Values.global.raw.helm.targetRevision }}
    helm:
      releaseName: global-netpol
      values: |
        # OpenStack (RKE2 with its bundled Cilium). Same policy set as Azure, with these differences:
        # - No kubernetes.azure.com/managedby exclusions; RKE2 system pods run in kube-system.
        # - The kube-apiserver rule also allows 6443: RKE2 runs the API server on the control-plane
        #   hosts, and Cilium evaluates policy after the Service (443) is translated to 6443.
        # - Egress is default-deny for every pod outside kube-system, as on Azure: the CoreDNS rule
        #   selects them all. Workloads need their own egress allows.
        # - Ingress is not made default-deny cluster-wide. The two ingress rules that select general
        #   workloads (remote nodes, Prometheus scrape) set enableDefaultDeny.ingress to false, so they
        #   only add allows. Namespaces get ingress default-deny from their own policies (aurora-namespace).
        resources:
          - apiVersion: cilium.io/v2
            kind: CiliumClusterwideNetworkPolicy
            metadata:
              name: allow-egress-to-apiserver-from-platform
            spec:
              endpointSelector:
                matchExpressions:
                  - {key: k8s:io.cilium.k8s.namespace.labels.namespace.ssc-spc.gc.ca/purpose, operator: In, values: [platform, system]}
              egress:
                - toEntities:
                    - kube-apiserver
                  toPorts:
                    - ports:
                        - port: "443"
                          protocol: TCP
                        - port: "6443"
                          protocol: TCP
          - apiVersion: cilium.io/v2
            kind: CiliumClusterwideNetworkPolicy
            metadata:
              name: allow-egress-to-coredns-from-ns
            spec:
              endpointSelector:
                matchExpressions:
                - key: k8s:io.kubernetes.pod.namespace
                  operator: NotIn
                  values:
                  - kube-system
                - key: k8s:io.cilium.k8s.namespace.labels.addonmanager.kubernetes.io/mode
                  operator: DoesNotExist
              # No L7 DNS rule: DNS is not sent through the Cilium DNS proxy cluster-wide. Namespaces
              # that use toFQDNs add their own rule. Matches bootstrap-platform's
              # manifests/allow-egress-to-coredns.yaml, which creates this policy before Argo CD.
              egress:
                - toEndpoints:
                    - matchLabels:
                        k8s:k8s-app: kube-dns
                        k8s:io.kubernetes.pod.namespace: kube-system
                    - matchLabels:
                        k8s:k8s-app: node-local-dns
                        k8s:io.kubernetes.pod.namespace: kube-system
                  toPorts:
                    - ports:
                        - port: "53"
                          protocol: UDP
                        - port: "53"
                          protocol: TCP
          - apiVersion: cilium.io/v2
            kind: CiliumClusterwideNetworkPolicy
            metadata:
              name: allow-egress-to-host-network-pods-from-prometheus
            spec:
              description: |
                This rule allows metrics scraping for pods running with Host-Networking (ie: CIDR-Allocator)
              egress:
              - toEntities:
                - remote-node
                - host
              endpointSelector:
                matchExpressions:
                - key: k8s:io.kubernetes.pod.namespace
                  operator: In
                  values:
                  - prometheus-system
          - apiVersion: "cilium.io/v2"
            kind: CiliumClusterwideNetworkPolicy
            metadata:
              name: "allow-from-remote-worker-nodes"
            spec:
              endpointSelector:
                matchExpressions:
                  - key: k8s:io.kubernetes.pod.namespace
                    operator: NotIn
                    values:
                    - kube-system
              enableDefaultDeny:
                ingress: false
              ingress:
                - fromEntities:
                  - remote-node
          - apiVersion: cilium.io/v2
            kind: CiliumClusterwideNetworkPolicy
            metadata:
              name: ambient-mesh-generic-authorization
            spec:
              description: "Generic symmetrical allow for all Ambient mesh namespaces"
              endpointSelector:
                matchExpressions:
                  - key: "k8s:io.cilium.k8s.namespace.labels.istio.io/dataplane-mode"
                    operator: In
                    values: ["ambient"]
              ingress:
                - fromEntities:
                  - all
                  toPorts:
                  - ports:
                    - port: "15008"
                      protocol: TCP
              egress:
                - toEntities:
                  - all
                  toPorts:
                  - ports:
                    - port: "15008"
                      protocol: TCP
          - apiVersion: cilium.io/v2
            kind: CiliumClusterwideNetworkPolicy
            metadata:
              name: prometheus-scrape-egress
            spec:
              description: "Allows Prometheus to scrape cluster pods labeled monitoring.aurora/scrape=true"
              endpointSelector:
                matchLabels:
                  "k8s:io.kubernetes.pod.namespace": "prometheus-system"
                  app.kubernetes.io/name: "prometheus"
              egress:
                - toEndpoints:
                    - matchLabels:
                        monitoring.aurora/scrape: "true"
                  toPorts:
                    - ports:
                        - port: "metrics"
                          protocol: TCP
          - apiVersion: cilium.io/v2
            kind: CiliumClusterwideNetworkPolicy
            metadata:
              name: allow-prometheus-scrape-ingress
            spec:
              description: "Allows inbound scraping from Prometheus to any labeled pod on the metrics port"
              endpointSelector:
                matchLabels:
                  monitoring.aurora/scrape: "true"
              enableDefaultDeny:
                ingress: false
              ingress:
                - fromEndpoints:
                    - matchLabels:
                        "k8s:io.kubernetes.pod.namespace": "prometheus-system"
                        app.kubernetes.io/name: "prometheus"
                  toPorts:
                    - ports:
                        - port: "metrics"
                          protocol: TCP
  destination:
    name: {{ .Values.global.cluster }}
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
