{{ if .Values.components.keda.enabled -}}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.global.cluster }}-keda-netpol"
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: {{ .Values.global.project }}
  source:
    chart: {{ .Values.global.raw.helm.chart }}
    repoURL: {{ default .Values.global.helm.repository .Values.global.raw.helm.repository }}
    targetRevision: {{ .Values.global.raw.helm.targetRevision }}
    helm:
      releaseName: keda-netpol
      values: |
        resources:
          # Base policy: allow pods within keda-system namespace to communicate
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-same-namespace
              namespace: keda-system
            spec:
              podSelector: {}
              ingress:
                - from:
                    - podSelector: {}
              egress:
                - to:
                    - podSelector: {}
              policyTypes:
                - Ingress
                - Egress
          
          # Allow DNS queries to kube-system (required for service discovery)
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-dns
              namespace: keda-system
            spec:
              podSelector: {}
              egress:
                - to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: kube-system
                  ports:
                    - protocol: UDP
                      port: 53
                    - protocol: TCP
                      port: 53
              policyTypes:
                - Egress
          
          # KEDA Metrics API Server: Allow ingress from anywhere on port 443
          # This allows the Kubernetes API server to reach KEDA's metrics API
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-keda-metrics-apiserver
              namespace: keda-system
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: keda-operator-metrics-apiserver
              ingress:
                - ports:
                    - protocol: TCP
                      port: 443
              policyTypes:
                - Ingress
          
          # KEDA Metrics API Server egress: Allow outbound traffic
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-keda-metrics-apiserver-egress
              namespace: keda-system
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: keda-operator-metrics-apiserver
              egress:
                - to:
                    - ipBlock:
                        cidr: 0.0.0.0/0
                {{- range .Values.global.loggingCidrs }}
                  - ports:
                      - protocol: TCP
                        port: 443
                    to:
                      - ipBlock:
                          cidr: {{ . | quote }}
                {{- end }}
              policyTypes:
                - Egress
          
          # KEDA Operator: Allow management ports
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-keda-operator
              namespace: keda-system
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: keda-operator
              ingress:
                - ports:
                    - protocol: TCP
                      port: 8080  # metrics port
                    - protocol: TCP
                      port: 9090  # webhook port
              policyTypes:
                - Ingress
          
          # KEDA Operator egress: Allow outbound traffic
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-keda-operator-egress
              namespace: keda-system
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: keda-operator
              egress:
                - to:
                    - ipBlock:
                        cidr: 0.0.0.0/0
                {{- range .Values.global.loggingCidrs }}
                  - ports:
                      - protocol: TCP
                        port: 443
                    to:
                      - ipBlock:
                          cidr: {{ . | quote }}
                {{- end }}
              policyTypes:
                - Egress
  destination:
    name: {{ .Values.global.cluster }}
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

{{- end }}