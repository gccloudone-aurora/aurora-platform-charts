{{ if .Values.components.keda.enabled -}}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.global.cluster }}-keda-netpol"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.global.project }}
  source:
    chart: {{ .Values.global.raw.helm.chart }}
    repoURL: {{ default .Values.global.helm.repository .Values.global.raw.helm.repository }}
    targetRevision: {{ .Values.global.raw.helm.targetRevision }}
    helm:
      releaseName: keda-netpol
      values: |
        resources:
          - apiVersion: "cilium.io/v2"
            kind: CiliumClusterwideNetworkPolicy
            metadata:
              name: clusterwide-keda-core-routing
            spec:
              description: "Global platform policy unblocking KEDA outbound cross-namespace polling loops and inbound HPA metric collections"
              endpointSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - keda-operator
                      - keda-operator-metrics-apiserver
              egress:
                # 1. Unblocks outbound polling: Allows KEDA to initiate connection loops to any app/port across the cluster
                - toEndpoints:
                    - {}
              ingress:
                # 2. Unblocks HPA metrics API: Allows control plane entities to safely read the extension endpoints
                - fromEntities:
                    - cluster
                    - host
                    - remote-node
                  toPorts:
                    - ports:
                        - port: "9666"
                          protocol: TCP
                        - port: "8080"
                          protocol: TCP
  destination:
    name: {{ .Values.global.cluster }}
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

{{- end }}
