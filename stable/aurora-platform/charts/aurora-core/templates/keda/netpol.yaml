{{ if .Values.components.keda.enabled -}}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.global.cluster }}-keda-netpol"
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: {{ .Values.global.project }}
  source:
    chart: {{ .Values.global.raw.helm.chart }}
    repoURL: {{ default .Values.global.helm.repository .Values.global.raw.helm.repository }}
    targetRevision: {{ .Values.global.raw.helm.targetRevision }}
    helm:
      releaseName: keda-netpol
      values: |
        resources:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-keda-metrics-apiserver
              namespace: keda-system
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: keda-operator-metrics-apiserver
              ingress:
                - ports:
                    - protocol: TCP
                      port: 443
              policyTypes:
                - Ingress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-keda-metrics-apiserver-egress
              namespace: keda-system
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: keda-operator-metrics-apiserver
              egress:
                - to:
                    - ipBlock:
                        cidr: 0.0.0.0/0
                {{- range .Values.global.loggingCidrs }}
                  - ports:
                      - protocol: TCP
                        port: 443
                    to:
                      - ipBlock:
                          cidr: {{ . | quote }}
                {{- end }}
              policyTypes:
                - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-keda-operator
              namespace: keda-system
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: keda-operator
              ingress:
                - ports:
                    - protocol: TCP
                      port: 8080
                    - protocol: TCP
                      port: 9090
              policyTypes:
                - Ingress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-keda-operator-egress
              namespace: keda-system
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: keda-operator
              egress:
                - to:
                    - ipBlock:
                        cidr: 0.0.0.0/0
                {{- range .Values.global.loggingCidrs }}
                  - ports:
                      - protocol: TCP
                        port: 443
                    to:
                      - ipBlock:
                          cidr: {{ . | quote }}
                {{- end }}
              policyTypes:
                - Egress
  destination:
    name: {{ .Values.global.cluster }}
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

{{- end }}
