{{ if .Values.components.opencost.enabled -}}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.global.cluster }}-opencost-netpol"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.global.project }}
  source:
    chart: {{ .Values.global.raw.helm.chart }}
    repoURL: {{ default .Values.global.helm.repository .Values.global.raw.helm.repository }}
    targetRevision: {{ .Values.global.raw.helm.targetRevision }}
    helm:
      releaseName: opencost-netpol
      values: |
        resources:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-same-namespace
              namespace: opencost-system
            spec:
              egress:
              - to:
                - podSelector: {}
              ingress:
              - from:
                - podSelector: {}
              podSelector: {}
              policyTypes:
              - Ingress
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-egress-to-api-server
              namespace: opencost-system
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: opencost
              policyTypes:
              - Egress
              egress:
              - to:
                - ipBlock:
                    cidr: {{ .Values.global.apiServerCidr }}
                ports:
                - protocol: TCP
                  port: 443
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-egress-to-prometheus-system
              namespace: opencost-system
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: opencost
              policyTypes:
              - Egress
              egress:
              - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: prometheus-system
                ports:
                - protocol: TCP
                  port: 9090
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-egress-to-fetch-pricing
              namespace: opencost-system
            spec:
              egress:
              - ports:
                - port: 443
                  protocol: TCP
                to:
                - ipBlock:
                    cidr: 0.0.0.0/0
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: opencost
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-egress-to-azuremetadataapi-from-opencost
              namespace: opencost-system
            spec:
              egress:
              - ports:
                - port: 80
                  protocol: TCP
                to:
                - ipBlock:
                    cidr: {{ .Values.global.azureMetadataApiCidr }}
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: opencost
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-ingress-from-prometheus-to-opencost
              namespace: opencost-system
            spec:
              ingress:
              - from:
                - namespaceSelector:
                    matchLabels:
                      namespace.ssc-spc.gc.ca/purpose: system
                      kubernetes.io/metadata.name: prometheus-system
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
                      app.kubernetes.io/instance: kube-prometheus-stack-prometheus
                ports:
                - protocol: TCP
                  port: 9003
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: opencost
              policyTypes:
              - Ingress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-ingress-from-opencost-system-to-prometheus
              namespace: prometheus-system
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
                  prometheus: kube-prometheus-stack-prometheus
              policyTypes:
              - Ingress
              ingress:
              - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: opencost-system
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: opencost
                ports:
                - protocol: TCP
                  port: 9090
  destination:
    name: {{ .Values.global.cluster }}
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
