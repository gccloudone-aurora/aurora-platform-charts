{{ if and .Values.components.loki.enabled .Values.components.loki.serviceMonitor.enabled -}}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.global.cluster }}-loki-servicemonitor"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.global.project }}
  source:
    chart: {{ .Values.global.raw.helm.chart }}
    repoURL: {{ default .Values.global.helm.repository .Values.global.raw.helm.repository }}
    targetRevision: {{ .Values.global.raw.helm.targetRevision }}
    helm:
      releaseName: loki-servicemonitor
      values: |
        resources:
        # Loki runs in simple scalable mode, therefore the read/write and backend exposes http-metrics port on the service
        # One ServiceMonitor can handle them all via shared name and instance labels
        # Chart will also create headdless services with identical labels, tagged as false to prevent duplicate scrapping of pods
          - apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            metadata:
              name: loki
              namespace: loki-system
              labels:
                app.kubernetes.io/name: loki
                app.kubernetes.io/part-of: loki-system
                app.kubernetes.io/managed-by: argo
            spec:
              selector:
                matchLabels:
                  app.kubernetes.io/name: loki
                matchExpressions:
                  - key: prometheus.io/service-monitor
                    operator: NotIn
                    values:
                      - "false"
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - read
                      - write
                      - backend
              endpoints:
                - port: http-metrics
                  interval: 30s
  destination:
    name: {{ .Values.global.cluster }}
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

{{- end }}
